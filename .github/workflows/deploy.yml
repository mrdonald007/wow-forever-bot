name: Deploy bot

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    # Only runs in the public repo; the private dev repo never deploys.
    if: github.repository == 'mrdonald007/wow-forever-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in KV namespace ID
        run: sed -i "s/__KV_ID__/${{ secrets.CF_KV_ID }}/" worker/wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            DISCORD_PUBLIC_KEY
            BLIZZ_ID
            BLIZZ_SECRET
            DISCORD_BOT_TOKEN
        env:
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          BLIZZ_ID: ${{ secrets.BLIZZ_ID }}
          BLIZZ_SECRET: ${{ secrets.BLIZZ_SECRET }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
