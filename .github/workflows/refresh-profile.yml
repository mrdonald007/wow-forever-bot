name: Refresh bot profile

on:
  workflow_dispatch:

jobs:
  refresh:
    # Only runs in the public repo; the private dev repo never deploys.
    if: github.repository == 'mrdonald007/wow-forever-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/refresh-profile.mjs
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
